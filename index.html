<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Segment Prompt Tester — Loyoly v0.5</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.development.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.development.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --blue-primary: #2965fe;
      --blue-light: #eef4ff;
      --blue-border: #1c4bf4;
      --text-primary: #404040;
      --text-secondary: #737373;
      --text-muted: #a3a3a3;
      --text-data: #525252;
      --red-delete: #ef4444;
      --bg-page: #f0f0f0;
      --bg-section: #fafafa;
      --bg-card: #ffffff;
      --bg-tab-inactive: #f5f5f5;
      --bg-tag-data: #f5f5f5;
      --border-default: #e5e5e5;
      --border-card: #eaeaea;
      --border-tag-data: #737373;
      --radius-modal: 16px;
      --radius-card: 16px;
      --radius-input: 8px;
      --radius-tag: 8px;
      --padding-modal: 32px;
      --padding-section: 16px;
      --font: 'Inter', system-ui, -apple-system, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--font); background: var(--bg-page); color: var(--text-primary); min-height: 100vh; display: flex; align-items: flex-start; justify-content: center; padding: 40px 16px; }
    /* Modal container */
    .modal { background: var(--bg-card); border-radius: var(--radius-modal); max-width: 680px; width: 100%; box-shadow: 0 8px 40px rgba(0,0,0,0.08), 0 1px 3px rgba(0,0,0,0.06); }
    .modal-header { padding: var(--padding-modal); padding-bottom: 16px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border-default); }
    .modal-header h1 { font-size: 16px; font-weight: 600; color: var(--text-primary); }
    .modal-close { width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; border: none; background: none; cursor: pointer; padding: 6px; border-radius: 4px; color: var(--text-muted); }
    .modal-close:hover { background: var(--bg-tab-inactive); }
    .modal-close svg { width: 12px; height: 12px; stroke: currentColor; stroke-width: 2; }
    .modal-body { padding: var(--padding-modal); padding-top: 12px; padding-bottom: 12px; display: flex; flex-direction: column; gap: 20px; }
    .modal-footer { padding: var(--padding-modal); padding-top: 24px; display: flex; gap: 16px; border-top: 1px solid var(--border-default); }
    /* Text field */
    .field-label { font-size: 13px; font-weight: 500; color: var(--text-primary); margin-bottom: 6px; display: flex; align-items: center; gap: 6px; }
    .field-input { width: 100%; border: 1px solid var(--border-default); border-radius: var(--radius-input); padding: 8px 12px; font-size: 13px; font-family: var(--font); color: var(--text-primary); background: var(--bg-card); outline: none; transition: border-color 0.15s; }
    .field-input:focus { border-color: var(--blue-primary); }
    .field-input::placeholder { color: var(--text-muted); }
    .field-help { font-size: 11px; color: var(--text-muted); margin-top: 4px; display: flex; justify-content: space-between; }
    /* Mode chips */
    .mode-bar { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
    .mode-label { font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
    .mode-chip { padding: 4px 12px; border-radius: var(--radius-tag); font-size: 12px; font-weight: 500; border: 1px solid var(--border-default); background: var(--bg-card); color: var(--text-secondary); cursor: pointer; transition: all 0.15s; font-family: var(--font); }
    .mode-chip:hover { border-color: var(--blue-primary); color: var(--blue-primary); }
    .mode-chip.active { background: var(--blue-primary); color: white; border-color: var(--blue-primary); }
    /* API key */
    .api-bar { display: flex; align-items: center; gap: 8px; padding: 10px 12px; background: #fffbeb; border: 1px solid #fde68a; border-radius: var(--radius-input); }
    .api-bar label { font-size: 11px; font-weight: 500; color: #92400e; white-space: nowrap; }
    .api-bar input { flex: 1; border: 1px solid #fde68a; border-radius: 6px; padding: 4px 8px; font-size: 11px; font-family: 'JetBrains Mono', monospace; background: white; outline: none; }
    .api-bar input:focus { border-color: #f59e0b; }
    .api-bar span { font-size: 10px; color: #d97706; white-space: nowrap; }
    /* Filter section */
    .filter-section { background: var(--bg-section); border: 1px solid var(--border-default); border-radius: var(--radius-card); padding: var(--padding-section); display: flex; flex-direction: column; gap: 16px; }
    .filter-header { display: flex; align-items: flex-start; gap: 12px; }
    .filter-icon { width: 36px; height: 36px; border-radius: 50%; background: var(--bg-tab-inactive); border: 1px solid var(--border-default); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .filter-icon svg { width: 16px; height: 16px; stroke: var(--text-secondary); fill: none; stroke-width: 1.5; }
    .filter-header-text h2 { font-size: 14px; font-weight: 500; color: var(--text-primary); }
    .filter-header-text p { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }
    /* Rule card */
    .rule-card { background: var(--bg-card); border: 1px solid var(--border-card); border-radius: var(--radius-card); padding: var(--padding-section); display: flex; flex-direction: column; gap: 12px; }
    .rule-top { display: flex; align-items: center; justify-content: space-between; }
    .rule-title { display: flex; align-items: center; gap: 8px; }
    .rule-title .drag-icon { color: var(--text-muted); }
    .rule-title span { font-size: 13px; font-weight: 500; color: var(--text-primary); }
    .btn-delete { background: none; border: none; font-size: 12px; font-weight: 500; color: var(--red-delete); cursor: pointer; padding: 6px 8px; border-radius: var(--radius-tag); font-family: var(--font); }
    .btn-delete:hover { background: #fef2f2; }
    /* Tabs pill */
    .tabs-pill { display: flex; background: var(--bg-tab-inactive); border-radius: var(--radius-tag); overflow: hidden; }
    .tab-item { flex: 1; text-align: center; padding: 6px 12px; font-size: 13px; font-weight: 500; color: var(--text-secondary); cursor: pointer; border-radius: var(--radius-tag); transition: all 0.15s; border: 1px solid transparent; font-family: var(--font); background: none; }
    .tab-item.active { background: var(--bg-card); border-color: var(--border-default); color: var(--blue-primary); box-shadow: 0 1px 2px rgba(0,0,0,0.04); }
    /* Section labels */
    .section-label { font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.3px; }
    /* Dropdown */
    .dropdown { display: inline-flex; align-items: center; gap: 6px; padding: 4px 8px; background: var(--bg-card); border: 1px solid var(--border-default); border-radius: var(--radius-tag); font-size: 13px; font-weight: 500; color: var(--text-primary); cursor: default; min-width: 0; font-family: var(--font); }
    .dropdown .chevron { width: 14px; height: 14px; stroke: var(--text-muted); fill: none; stroke-width: 2; flex-shrink: 0; }
    /* Operator tag */
    .op-tag { display: inline-flex; align-items: center; gap: 4px; padding: 2px 6px; background: var(--blue-light); border: 1px solid var(--blue-border); border-radius: var(--radius-tag); font-size: 13px; font-weight: 500; color: var(--blue-border); white-space: nowrap; }
    .op-tag.negated { background: #fef2f2; border-color: var(--red-delete); color: var(--red-delete); }
    /* Data tag */
    .data-tag { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; background: var(--bg-tag-data); border: 1px solid var(--border-tag-data); border-radius: var(--radius-tag); font-size: 13px; font-weight: 500; color: var(--text-data); }
    .data-tag svg { width: 14px; height: 14px; stroke: var(--text-secondary); fill: none; stroke-width: 1.5; }
    /* Filter row */
    .filter-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .filter-row-group { display: flex; flex-direction: column; gap: 6px; }
    .filter-row-with-label { display: flex; align-items: center; gap: 6px; }
    .filter-row-with-label .et-label { font-size: 11px; font-weight: 600; color: var(--blue-primary); padding: 4px 0; }
    /* Trash icon */
    .trash-btn { background: none; border: none; cursor: pointer; padding: 4px; color: var(--text-muted); border-radius: 4px; display: flex; }
    .trash-btn:hover { background: #fef2f2; color: var(--red-delete); }
    .trash-btn svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 1.5; }
    /* Section divider */
    .section-divider { display: flex; align-items: center; gap: 8px; }
    .section-divider .label { font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; white-space: nowrap; }
    .section-divider .line { flex: 1; height: 1px; background: var(--border-default); }
    /* AND/OR divider */
    .logic-divider { display: flex; align-items: center; gap: 12px; padding: 4px 0; }
    .logic-divider .line { flex: 1; height: 1px; background: var(--border-default); }
    .logic-divider .logic-badge { display: inline-flex; align-items: center; gap: 4px; padding: 4px 8px; border-radius: var(--radius-tag); font-size: 11px; font-weight: 600; }
    .logic-divider .logic-badge.small { padding: 4px; font-size: 11px; color: var(--text-secondary); }
    .logic-divider .logic-badge.primary { background: var(--blue-primary); color: white; padding: 2px 8px; cursor: default; }
    .logic-divider .logic-badge.primary svg { width: 14px; height: 14px; stroke: white; fill: none; stroke-width: 2; }
    /* Add button */
    .btn-add { display: inline-flex; align-items: center; gap: 4px; padding: 6px 8px; border-radius: var(--radius-tag); font-size: 12px; font-weight: 500; color: var(--text-primary); background: var(--bg-card); border: 1px solid var(--border-default); cursor: pointer; font-family: var(--font); transition: all 0.15s; }
    .btn-add:hover { border-color: var(--blue-primary); color: var(--blue-primary); }
    .btn-add svg { width: 10px; height: 10px; stroke: var(--blue-primary); fill: none; stroke-width: 2.5; }
    .btn-add.full-width { width: 100%; justify-content: center; }
    /* Footer buttons */
    .btn-secondary { flex: 0 0 auto; padding: 8px 12px; border-radius: var(--radius-input); font-size: 13px; font-weight: 500; color: var(--text-primary); background: var(--bg-card); border: 1px solid var(--border-default); cursor: pointer; font-family: var(--font); transition: all 0.15s; }
    .btn-secondary:hover { border-color: var(--text-secondary); }
    .btn-primary { flex: 1; padding: 8px 12px; border-radius: var(--radius-input); font-size: 13px; font-weight: 500; color: white; background: var(--blue-primary); border: none; cursor: pointer; font-family: var(--font); transition: all 0.15s; }
    .btn-primary:hover { background: #1e54e6; }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
    /* JSON panel */
    .json-panel { background: #0f172a; border-radius: var(--radius-card); padding: 16px; overflow: auto; max-height: 400px; }
    .json-panel pre { font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 12px; line-height: 1.5; color: #e2e8f0; margin: 0; }
    .json-key { color: #a78bfa; }
    .json-str { color: #34d399; }
    .json-num { color: #fbbf24; }
    .json-bool { color: #f87171; }
    /* Trace table */
    .trace-table { width: 100%; border-collapse: collapse; font-size: 12px; }
    .trace-table th { text-align: left; padding: 8px; background: var(--bg-tab-inactive); border-bottom: 1px solid var(--border-default); font-size: 11px; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.3px; }
    .trace-table td { padding: 8px; border-bottom: 1px solid var(--bg-tab-inactive); font-size: 12px; }
    .trace-table td:first-child { color: var(--text-secondary); font-weight: 500; }
    .trace-table td:last-child { font-family: 'JetBrains Mono', monospace; color: var(--text-primary); font-size: 11px; }
    .trace-table tr:nth-child(even) { background: var(--bg-section); }
    /* Result tabs */
    .result-tabs { display: flex; gap: 0; border-bottom: 1px solid var(--border-default); background: var(--bg-section); border-radius: var(--radius-card) var(--radius-card) 0 0; overflow: hidden; }
    .result-tab { padding: 10px 16px; font-size: 13px; font-weight: 500; color: var(--text-secondary); cursor: pointer; border: none; background: none; border-bottom: 2px solid transparent; margin-bottom: -1px; font-family: var(--font); transition: all 0.15s; }
    .result-tab:hover { color: var(--text-primary); }
    .result-tab.active { color: var(--blue-primary); border-bottom-color: var(--blue-primary); background: var(--bg-card); }
    /* Status badges */
    .status-badges { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
    .status-badge { display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px; border-radius: 999px; font-size: 11px; font-weight: 600; }
    .status-badge.success { background: #f0fdf4; color: #16a34a; }
    .status-badge.error { background: #fef2f2; color: var(--red-delete); }
    .status-badge.warning { background: #fffbeb; color: #d97706; }
    .status-badge.info { background: var(--blue-light); color: var(--blue-primary); }
    /* Examples */
    .examples-section { display: flex; flex-direction: column; gap: 8px; }
    .examples-grid { display: flex; flex-wrap: wrap; gap: 6px; }
    .example-chip { padding: 4px 10px; border-radius: var(--radius-tag); font-size: 11px; color: var(--text-secondary); background: var(--bg-card); border: 1px solid var(--border-default); cursor: pointer; font-family: var(--font); transition: all 0.15s; text-align: left; line-height: 1.4; }
    .example-chip:hover { border-color: var(--blue-primary); color: var(--blue-primary); background: var(--blue-light); }
    .example-chip:disabled { opacity: 0.5; cursor: not-allowed; }
    /* Concordance modal */
    .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 100; display: flex; align-items: center; justify-content: center; }
    .concordance-modal { background: var(--bg-card); border-radius: var(--radius-modal); max-width: 700px; width: 95vw; max-height: 85vh; overflow-y: auto; padding: 24px; box-shadow: 0 25px 50px rgba(0,0,0,0.25); }
    .concordance-tag { display: inline-block; background: var(--blue-light); color: var(--blue-border); border-radius: 4px; padding: 1px 6px; font-size: 11px; margin: 2px; }
    /* Spinner */
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--blue-primary); border-top-color: transparent; border-radius: 50%; animation: spin 0.6s linear infinite; }
    /* Result wrapper */
    .result-wrapper { background: var(--bg-card); border: 1px solid var(--border-card); border-radius: var(--radius-card); overflow: hidden; }
    .result-content { padding: 16px; }
    /* Time window chip */
    .tw-chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; background: var(--bg-tab-inactive); border: 1px solid var(--border-default); border-radius: var(--radius-tag); font-size: 12px; color: var(--text-secondary); }
    /* Sidebar on desktop */
    @media (min-width: 1024px) {
      body { padding: 40px 24px; }
      .app-layout { display: grid; grid-template-columns: 1fr 300px; gap: 20px; max-width: 1000px; width: 100%; align-items: start; }
      .modal { max-width: none; }
    }
    @media (max-width: 1023px) {
      .app-layout { max-width: 680px; width: 100%; }
      .sidebar { display: none; }
    }
    .sidebar { display: flex; flex-direction: column; gap: 12px; }
    .sidebar-card { background: var(--bg-card); border: 1px solid var(--border-card); border-radius: var(--radius-card); overflow: hidden; }
    .sidebar-card-header { padding: 12px 16px; background: var(--bg-section); border-bottom: 1px solid var(--border-default); font-size: 13px; font-weight: 600; color: var(--text-primary); cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
    .sidebar-card-body { padding: 12px; max-height: 320px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
    .rollup-item { padding: 8px; border-radius: var(--radius-input); font-size: 12px; background: var(--bg-section); border: 1px solid transparent; }
    .rollup-item.active { background: var(--blue-light); border-color: var(--blue-primary); }
    .rollup-item .name { font-weight: 600; color: var(--text-primary); margin-bottom: 2px; }
    .rollup-item .key { font-family: monospace; color: var(--text-muted); font-size: 10px; }
    .rollup-item .measures { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
    .rollup-item .measure-tag { background: var(--blue-light); color: var(--blue-primary); padding: 1px 6px; border-radius: 4px; font-size: 10px; }
    .tips-card { padding: 16px; font-size: 12px; color: var(--text-secondary); line-height: 1.6; }
    .tips-card p { margin-bottom: 4px; }
    .tips-card strong { color: var(--text-primary); }
    /* Textarea */
    .prompt-textarea { width: 100%; border: 1px solid var(--border-default); border-radius: var(--radius-input); padding: 8px 12px; font-size: 13px; font-family: var(--font); color: var(--text-primary); background: var(--bg-card); outline: none; transition: border-color 0.15s; resize: none; }
    .prompt-textarea:focus { border-color: var(--blue-primary); }
    .prompt-textarea::placeholder { color: var(--text-muted); }
  </style>
</head>

<div id="root"></div>
<script type="text/babel">
const { useState, useCallback } = React;
/* =============================================================
   ROLLUP SCHEMA
============================================================= */
const ROLLUPS = {
  completed_orders: {

    measures: {

      order_product_dcount: { label: "Produits distincts", keywords: /\bproduits?\s*distincts?\b|\bproduits?\s*diff[eé]rents?\b|\bproduits?\s*uniques?\b|\bréférences?\s*distinctes?\b/i },

    defaultOperator: "gte",

  points_transaction: {

    label: "Transactions de points",

function splitByLogic(text) {

  }

  if (andLoose.length > 1) {

function parsePrompt(text) {

  trace.push({ step: "Négation / exclusion", result: isNegated ? "Oui — mode exclusion" : "Non" });
  const rollupKey = detectRollup(tl);
  if (!rollupKey) errors.push("Rollup non reconnu. Essayez : commande, mission, point, parrainage, récompense.");
  trace.push({ step: "Rollup détecté", result: rollupKey ? ROLLUPS[rollupKey].icon+" "+rollupKey+" — "+ROLLUPS[rollupKey].label : "Aucun rollup reconnu" });
  const timeWindow = detectTimeWindow(t);
  trace.push({ step: "Fenêtre temporelle", result: timeWindow ? timeWindow.label+" ("+timeWindow.type+")" : "Toutes périodes" });
  const operator = isNegated ? "eq" : detectOperator(tl);
  trace.push({ step: "Opérateur", result: (OP_LABELS[operator] || operator)+(isNegated ? " [forcé par négation]" : "") });
  const betweenVals = operator === "between" ? extractBetweenValues(tl) : null;
  const numResult = operator === "is_not_null" ? { value: null, textual: null } : extractNumericValue(tl);
  const value = isNegated ? 0 : operator === "is_not_null" ? null : (betweenVals ? betweenVals[0] : numResult.value);
  trace.push({
    step: "Valeur extraite",
    result: operator === "is_not_null" ? "null (is_not_null)"
      : numResult.textual
        ? value+'  (depuis texte : "'+numResult.textual+'")'
        : value+(betweenVals ? " à "+betweenVals[1] : ""),
  });
  if (operator !== "is_not_null" && numResult.value === 1 && !numResult.textual && !isNegated && !/\b1\b/.test(t)) {
    warnings.push("Aucune valeur numérique détectée — défaut : 1");

  const measureField = detectMeasureField(rollupKey, tl);
  const effectiveMeasure = measureField || (rollupKey ? ROLLUPS[rollupKey].defaultMeasure : "count");
  trace.push({ step: "Mesure", result: measureField ? measureField+" (détecté)" : effectiveMeasure+" (défaut)" });

  if (Object.keys(dimensionFilters).length > 0) {

  const query = buildDSLQuery(rollupKey, effectiveMeasure, operator, value, betweenVals, timeWindow, isNegated, dimensionFilters);

    success: true, errors, warnings, raw: text, trace,

function parseCompoundPrompt(text) {
  const { parts, logic } = splitByLogic(text);
  if (parts.length === 1) {
    return { ...parsePrompt(text), isCompound: false, logic };
  }
  const subResults = parts.map(part => {
    const r = parsePrompt(part);
    if (!r.success) {
      const prefixed = parsePrompt("ayant " + part);
      return prefixed.success ? { ...prefixed, raw: part } : r;
    }
    return r;
  });
  const validResults = subResults.filter(r => r.success);
  if (validResults.length === 0) return { ...parsePrompt(text), isCompound: false, logic };
  if (validResults.length === 1) return { ...validResults[0], isCompound: false, logic };
  const allQueries = validResults.flatMap(r => r.segment.queries);
  const allWarnings = subResults.flatMap(r => r.warnings);
  const allErrors = subResults.filter(r => !r.success).flatMap(r => r.errors);
  const combinedTrace = [
    { step: "Logique compound", result: logic+" — "+parts.length+" clauses détectées" },
    ...subResults.flatMap((r, i) => [
      { step: "Clause "+(i+1), result: '"'+parts[i]+'"' },
      ...r.trace.map(t => ({ step: "  "+t.step, result: t.result })),
    ]),
  ];
  // Merge queries on the same rollup: first query's having stays, others become where filters
  const mergedQueries = [];
  const rollupMap = {};
  for (const q of allQueries) {
    if (rollupMap[q.rollup] !== undefined) {
      const primary = mergedQueries[rollupMap[q.rollup]];
      // Move this query's having conditions into primary's where
      for (const h of (q.having || [])) {
        if (!primary.where) primary.where = [];
        primary.where.push(h);
      }
      // Merge any where conditions too (e.g. date filters)
      for (const w of (q.where || [])) {
        if (!primary.where) primary.where = [];
        // Avoid duplicate rollup_date entries — keep the first one
        if (w.field === "rollup_date" && primary.where.some(pw => pw.field === "rollup_date")) continue;
        primary.where.push(w);
      }
    } else {
      rollupMap[q.rollup] = mergedQueries.length;
      mergedQueries.push(JSON.parse(JSON.stringify(q)));
    }
  }
  combinedTrace.push({ step: "Merge same-rollup", result: allQueries.length+" queries → "+mergedQueries.length+" merged" });
  return {
    success: true, errors: allErrors, warnings: allWarnings,
    raw: text, trace: combinedTrace, isCompound: true, logic,
    clauseParts: parts,
    segment: { operator: logic.toLowerCase(), queries: mergedQueries },
  };
}

    method: "POST",
    headers: {
      "x-api-key": apiKey,
      "anthropic-version": "2023-06-01",
      "content-type": "application/json",
      "anthropic-dangerous-direct-browser-access": "true",
    },
    body: JSON.stringify({
      model: "claude-haiku-4-5-20251001",

      system: CLAUDE_SYSTEM_PROMPT,
      messages: [{ role: "user", content: text }],

  }
  const data = await response.json();
  const rawText = (data.content?.[0]?.text || "").trim();
  // Strip markdown fences if present
  let cleaned = rawText.replace(/^```(?:json)?\s*/i, "").replace(/\s*```$/,"").trim();

  jsonStr = jsonStr.replace(/\/\/[^\n]*/g, "");
  return { segment: JSON.parse(jsonStr), raw: rawText };

                ))}
              </div>
            </div>
          ))}
        </div>
        <div style={{marginTop:24,textAlign:'right'}}>
          <button onClick={onClose} className="btn-primary" style={{flex:'none',padding:'8px 20px'}}>Fermer</button>
        </div>
      </div>
    </div>
  );
}
function SchemaSidebar({ selectedRollup }) {
  const [open, setOpen] = useState(true);
  return (
    <div className="sidebar-card">
      <div className="sidebar-card-header" onClick={() => setOpen(o => !o)}>
        <span>Rollups disponibles</span>
        <span style={{fontSize:10,color:'var(--text-muted)'}}>{open ? "▲" : "▼"}</span>
      </div>
      {open && (
        <div className="sidebar-card-body">
          {Object.entries(ROLLUPS).map(([key, r]) => (
            <div key={key} className={"rollup-item"+(selectedRollup===key?" active":"")}>
              <div className="name">{r.icon} {r.label}</div>
              <div className="key">{key}</div>
              {Object.keys(r.measures||{}).length > 0 && (
                <div className="measures">
                  {Object.entries(r.measures).map(([mk,mv]) => (
                    <span key={mk} className="measure-tag">{mv.label}</span>
                  ))}
                </div>
              )}
            </div>
          ))}
        </div>
      )}
    </div>
  );
}
/* =============================================================
   APP
============================================================= */
function App() {
  const [input, setInput] = useState("");
  const [result, setResult] = useState(null);
  const [activeTab, setActiveTab] = useState("segment");
  const [showConcordance, setShowConcordance] = useState(false);
  const [apiKey, setApiKey] = useState("");
  const [mode, setMode] = useState("rules");
  const [isLoading, setIsLoading] = useState(false);
  const [aiResult, setAiResult] = useState(null);
  const runWithText = useCallback(async (text) => {
    if (!text.trim()) return;
    if (mode === "rules") {
      setResult(parseCompoundPrompt(text));
      setAiResult(null);
      setActiveTab("segment");
      return;
    }
    if (mode === "ai") {
      if (!apiKey.trim()) {
        setResult({
          success: false,
          errors: ["Clé API Anthropic requise pour le mode Claude IA."],
          warnings: [], raw: text, trace: [], segment: null,
        });
        setAiResult(null);
        setActiveTab("segment");
        return;
      }
      setResult(null); setAiResult(null); setIsLoading(true);
      try {
        const r = await callClaudeAPI(text, apiKey.trim());
        setAiResult({ segment: r.segment, raw: r.raw, error: null });
        setResult({
          success: true, errors: [], warnings: [], raw: text,
          trace: [{ step: "Mode", result: "Interprétation Claude IA" }],
          isCompound: (r.segment.queries?.length || 0) > 1,
          logic: r.segment.operator || "and",
          segment: r.segment,
        });
      } catch (e) {
        setAiResult({ segment: null, raw: null, error: e.message });
        setResult({
          success: false, errors: [e.message], warnings: [],
          raw: text, trace: [], segment: null,
        });
      } finally { setIsLoading(false); }
      setActiveTab("segment");
      return;
    }
    // Hybrid
    const rulesResult = parseCompoundPrompt(text);
    setResult(rulesResult); setAiResult(null); setActiveTab("segment");
    if (apiKey.trim()) {
      setIsLoading(true);
      try {
        const r = await callClaudeAPI(text, apiKey.trim());
        setAiResult({ segment: r.segment, raw: r.raw, error: null });
      } catch (e) {
        setAiResult({ segment: null, raw: null, error: e.message });
      } finally { setIsLoading(false); }
    }
  }, [mode, apiKey]);
  const run = useCallback(() => runWithText(input), [input, runWithText]);
  const handleKey = e => { if ((e.ctrlKey || e.metaKey) && e.key === "Enter") run(); };
  const loadExample = ex => { setInput(ex); runWithText(ex); };
  const selectedRollup = result?.segment?.queries?.[0]?.rollup || null;
  const segmentLogic = result?.segment?.operator || "and";
  const segmentTitle = input.trim() ? input.trim() : "Nouveau segment";
  const tabs = [
    { key: "segment", label: "Segment" },
    { key: "json", label: "JSON" },
    { key: "trace", label: "Trace" },
    ...(aiResult ? [{ key: "ai", label: "Claude IA" }] : []),
  ];
  return (
    <div className="app-layout">
      {showConcordance && <ConcordanceModal onClose={() => setShowConcordance(false)} />}
      {/* Main column */}
      <div style={{display:'flex',flexDirection:'column',gap:16}}>
        {/* Modal */}
        <div className="modal">
          {/* Header */}
          <div className="modal-header">
            <h1>Segment : {segmentTitle.length > 40 ? segmentTitle.slice(0,40)+"…" : segmentTitle}</h1>
            <button className="modal-close" onClick={() => setShowConcordance(true)} title="Table de concordance">
              <svg viewBox="0 0 14 14" style={{width:14,height:14,stroke:'var(--text-muted)',strokeWidth:1.5,fill:'none'}}>
                <circle cx="7" cy="7" r="6"/><path d="M7 4v4M7 10v.5"/>
              </svg>
            </button>
          </div>
          {/* Body */}
          <div className="modal-body">
            {/* Mode toggle */}
            <div className="mode-bar">
              <span className="mode-label">Mode</span>
              {[
                { key: "rules", label: "Règles" },
                { key: "ai", label: "Claude IA" },
                { key: "hybrid", label: "Hybride" },
              ].map(m => (
                <button
                  key={m.key}
                  onClick={() => { setMode(m.key); setAiResult(null); }}
                  className={"mode-chip"+(mode === m.key ? " active" : "")}
                >
                  {m.label}
                </button>
              ))}
            </div>
            {/* API key */}
            {mode !== "rules" && (
              <div className="api-bar">
                <label>API Key :</label>
                <input
                  type="password"
                  placeholder="sk-ant-api03-..."
                  value={apiKey}
                  onChange={e => setApiKey(e.target.value)}
                />
                <span>non stockée</span>
              </div>
            )}
            {/* Prompt input */}
            <div>
              <div className="field-label">Description du segment</div>
              <textarea
                className="prompt-textarea"
                rows={3}
                placeholder='Ex: "Clients ayant acheté 3 fois ET complété au moins 2 missions"'
                value={input}
                onChange={e => setInput(e.target.value)}
                onKeyDown={handleKey}
              />
              <div className="field-help">
                <span>Ctrl+Entrée pour parser</span>
                <span>{input.length}/500</span>
              </div>
            </div>
            {/* Filter section — results */}
            {(result || isLoading) && (
              <div className="filter-section">
                <div className="filter-header">
                  <div className="filter-icon"><IconFilter /></div>
                  <div className="filter-header-text">
                    <h2>Règles de ciblage</h2>
                    <p>Résultat de l'interprétation du prompt</p>
                  </div>
                </div>
                {/* Status badges */}
                {result && (
                  <div className="status-badges">
                    {result.success
                      ? <span className="status-badge success">Parsing réussi</span>
                      : <span className="status-badge error">Échec</span>}
                    {result.isCompound && (
                      <span className="status-badge info">
                        {segmentLogic} — {result.segment?.queries?.length || 0} queries
                      </span>
                    )}
                    {mode !== "rules" && (
                      <span className="status-badge info">
                        {mode === "ai" ? "Claude IA" : "Hybride"}
                      </span>
                    )}
                    {isLoading && (
                      <span className="status-badge warning">
                        <span className="spinner" style={{width:10,height:10,borderWidth:1.5}} /> Claude IA…
                      </span>
                    )}
                    {result.errors?.map((e,i) => <span key={i} className="status-badge error">{e}</span>)}
                    {result.warnings?.map((w,i) => <span key={i} className="status-badge warning">{w}</span>)}
                  </div>
                )}
                {isLoading && !result && (
                  <div style={{display:'flex',alignItems:'center',justifyContent:'center',gap:12,padding:'32px 0',color:'var(--text-muted)'}}>
                    <span className="spinner" style={{width:20,height:20,borderWidth:3}} />
                    <span style={{fontSize:13}}>Claude IA interprète le prompt…</span>
                  </div>
                )}
                {/* Tabs */}
                <div className="result-wrapper">
                  <div className="result-tabs">
                    {tabs.map(tab => (
                      <button
                        key={tab.key}
                        onClick={() => setActiveTab(tab.key)}
                        className={"result-tab"+(activeTab === tab.key ? " active" : "")}
                      >
                        {tab.label}
                      </button>
                    ))}
                  </div>
                  <div className="result-content">
                    {/* Segment tab */}
                    {activeTab === "segment" && result?.segment && (
                      <div style={{display:'flex',flexDirection:'column',gap:0}}>
                        {result.segment.queries.map((q, i) => (
                          <React.Fragment key={i}>
                            {i > 0 && <LogicDivider logic={segmentLogic} />}
                            <ConditionCard query={q} index={i} />
                          </React.Fragment>
                        ))}
                      </div>
                    )}
                    {/* JSON tab */}
                    {activeTab === "json" && result?.segment && <JsonHighlight obj={result.segment} />}
                    {/* Trace tab */}
                    {activeTab === "trace" && (
                      mode === "ai" ? (
                        <div style={{textAlign:'center',padding:24,color:'var(--text-muted)',fontSize:13}}>
                          Mode Claude IA — trace pas à pas non disponible.
                          <div style={{fontSize:11,marginTop:4}}>Passez en mode Hybride pour voir la trace.</div>
                        </div>
                      ) : result?.trace ? (
                        <TracePanel trace={result.trace} />
                      ) : null
                    )}
                    {/* AI tab */}
                    {activeTab === "ai" && (
                      <div>
                        {isLoading && (
                          <div style={{display:'flex',alignItems:'center',justifyContent:'center',gap:12,padding:'32px 0',color:'var(--text-muted)'}}>
                            <span className="spinner" style={{width:20,height:20,borderWidth:3}} />
                            <span style={{fontSize:13}}>Claude IA interprète…</span>
                          </div>
                        )}
                        {!isLoading && aiResult?.error && (
                          <div style={{background:'#fef2f2',color:'var(--red-delete)',borderRadius:8,padding:12,fontSize:13,border:'1px solid #fecaca'}}>
                            <strong>Erreur :</strong> {aiResult.error}
                          </div>
                        )}
                        {!isLoading && aiResult?.segment && (
                          <div style={{display:'flex',flexDirection:'column',gap:12}}>
                            <div className="status-badges">
                              <span className="status-badge info">Interprétation Claude</span>
                              <span className="status-badge" style={{background:'var(--bg-tab-inactive)',color:'var(--text-secondary)'}}>claude-haiku-4-5</span>
                              {mode === "hybrid" && result && (
                                <span className={"status-badge "+(
                                  aiResult.segment.queries?.length === result.segment?.queries?.length
                                    ? "success" : "warning"
                                )}>
                                  {aiResult.segment.queries?.length === result.segment?.queries?.length
                                    ? "Accord avec les règles"
                                    : "Divergence avec les règles"}
                                </span>
                              )}
                            </div>
                            {aiResult.segment.queries?.map((q, i) => (
                              <React.Fragment key={i}>
                                {i > 0 && <LogicDivider logic={aiResult.segment.operator || "and"} />}
                                <ConditionCard query={q} index={i} />
                              </React.Fragment>
                            ))}
                            <div style={{marginTop:8}}>
                              <div style={{fontSize:11,fontWeight:600,color:'var(--text-secondary)',marginBottom:6}}>JSON brut Claude :</div>
                              <JsonHighlight obj={aiResult.segment} />
                            </div>
                          </div>
                        )}
                      </div>
                    )}
                  </div>
                </div>
              </div>
            )}
          </div>
          {/* Footer */}
          <div className="modal-footer">
            <button className="btn-secondary" onClick={() => setShowConcordance(true)}>
              Concordance
            </button>
            <button
              className="btn-primary"
              onClick={run}
              disabled={!input.trim() || isLoading}
            >
              {isLoading ? "En cours…" : "Créer"}
            </button>
          </div>
        </div>
        {/* Examples */}
        <div className="examples-section" style={{background:'var(--bg-card)',borderRadius:'var(--radius-card)',border:'1px solid var(--border-card)',padding:16}}>
          <div className="section-label">Exemples de prompts</div>
          <div className="examples-grid">
            {EXAMPLES.map((ex, i) => (
              <button key={i} onClick={() => loadExample(ex)} disabled={isLoading} className="example-chip">
                {ex}
              </button>
            ))}
          </div>
        </div>
      </div>
      {/* Sidebar */}
      <div className="sidebar">
        <SchemaSidebar selectedRollup={selectedRollup} />
        <div className="sidebar-card">
          <div className="sidebar-card-header">Modes d'interprétation</div>
          <div className="tips-card">
            <p><strong>Règles</strong> — Parser regex déterministe. Rapide, prévisible.</p>
            <p><strong>Claude IA</strong> — NL complet par claude-haiku. Comprend les formulations ambiguës.</p>
            <p><strong>Hybride</strong> — Les deux en parallèle. Comparez dans l'onglet Claude IA.</p>
          </div>
        </div>
        <div className="sidebar-card">
          <div className="sidebar-card-header">Astuces</div>
          <div className="tips-card">
            <p><strong>ET</strong> : "ayant X ET ayant Y" → AND</p>
            <p><strong>OU</strong> : "ayant X OU ayant Y" → OR</p>
            <p><strong>Nombres</strong> : "deux", "trois", "plusieurs"</p>
            <p><strong>Temps</strong> : hier, ce mois-ci, en janvier…</p>
            <p><strong>Exclusion</strong> : "sans commande", "jamais"</p>
            <p><strong>Fourchette</strong> : "entre 2 et 5"</p>
          </div>
        </div>
      </div>
    </div>
  );
}
const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
